<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Play Battleship in your browser against an AI opponent." />
    <meta name="theme-color" content="#0b1d33" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>" />
    <title>Battleship vs AI</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="header">
        <h1>Battleship <span class="vs">vs AI</span></h1>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </header>

      <section id="game-over-bar" class="game-over-bar" hidden>
        <span id="game-over-text"></span>
        <button type="button" id="play-again-bar" class="btn btn-primary">Play again</button>
      </section>

      <section id="placement" class="placement" aria-label="Place your fleet">
        <div class="ship-picker" id="ship-picker" role="listbox" aria-label="Ships to place"></div>
        <div class="controls">
          <button type="button" id="rotate" class="btn">Rotate <kbd>R</kbd></button>
          <button type="button" id="randomize" class="btn">Randomize</button>
          <button type="button" id="reset" class="btn">Clear</button>
          <button type="button" id="start" class="btn btn-primary" disabled>Start battle</button>
        </div>
      </section>

      <main class="boards">
        <section class="board-panel" id="player-panel">
          <h2>Your fleet</h2>
          <div id="player-board" class="board"></div>
          <ul id="player-fleet" class="fleet-status" aria-label="Your ships"></ul>
        </section>
        <section class="board-panel" id="enemy-panel">
          <h2>Enemy waters</h2>
          <div id="enemy-board" class="board"></div>
          <ul id="enemy-fleet" class="fleet-status" aria-label="Enemy ships"></ul>
        </section>
      </main>

      <footer class="legend" aria-hidden="true">
        <span><i class="swatch swatch-ship"></i>Ship</span>
        <span><i class="swatch swatch-hit"></i>Hit</span>
        <span><i class="swatch swatch-miss"></i>Miss</span>
        <span><i class="swatch swatch-sunk"></i>Sunk</span>
        <span><i class="swatch swatch-last"></i>Last shot</span>
      </footer>
    </div>

    <div id="overlay" class="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <h2 id="result-title"></h2>
        <p id="result-detail"></p>
        <div class="dialog-actions">
          <button type="button" id="view-board" class="btn">View board</button>
          <button type="button" id="play-again" class="btn btn-primary">Play again</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
